<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TopSort Web-App</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; padding: 1rem; max-width:900px; }
    .bad { background-color:crimson; }
    .good { background-color:green; }
    #theonlytext { width: 100%; font-size: 1.2rem; padding: 0.5rem; }
    .yetanothertext { display: none; width: 100%; font-size: 1.2rem; padding: 0.5rem; margin-bottom: 1rem; }
    .controls { margin-top: 1rem; }
    button { font-size: 1.1rem; padding: 0.5rem 1rem; }
    
  </style>
</head>
<body>
  <h1>Write your text</h1>

  <div>
    <input class="yetanothertext" id="extraInput1" placeholder="Just kidding, enter opening symbol (e.g. <)" />
     <input class="yetanothertext" id="extraInput2" placeholder="Enter closing symbol (e.g. >)">
    <input id="theonlytext" placeholder="Your text to be verified, with the parentheses thingy" />
    <div class="controls">
      <button id="theonlybutton"> I don't actually do anything, besides changing collor when everything looks good. </button>
      <div id="out" aria-live="polite"></div>
    </div>
  </div>
  <div id="pairsDisplay"></div>

  <script src="script.js">
  </script>
</body>
</html>
